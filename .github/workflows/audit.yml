name: audit

on:
  pull_request:
  push:
    branches: [main]

# The default token only gets what is listed here.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Chromium for the tests that drive a real page (tests/test_rules.py); without it they skip.
      # The Playwright version is pinned in requirements.txt, so its browser cache is keyed on that.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Dependencies are consistent
        run: pip check

      - name: Lint
        run: ruff check . --output-format=github

      - name: Every Python file compiles
        run: python -m compileall -q .

      - name: Tests
        # Exit code 5 means no tests were collected; treat that as a pass
        # until the tracks add their own tests.
        # -rs lists every skipped test and why, so a skip in CI is visible, not silent.
        run: pytest -q -rs || [ $? -eq 5 ]

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the PR's commits to scan only those
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
